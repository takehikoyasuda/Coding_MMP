# Publish the package manual to GitHub Pages.
#
# installPackage writes its html for a local Macaulay2 installation: the
# stylesheet, the KaTeX scripts that render the mathematics, and every link to
# a core Macaulay2 node are absolute paths into the M2 prefix.  Uploading that
# directory as it stands gives an unstyled page with the mathematics as raw TeX
# and those links dead, so .github/make-site.sh repairs it first.
#
# Nothing generated is committed: the manual is rebuilt here from the sources
# on every push, and the run fails if any documented example stops working
# (make docs passes IgnoreExampleErrors => false).
name: Manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # The pinned SteinFactorization and FlipComputation sources are needed:
      # MMPComputation's documentation examples load them.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The Macaulay2 PPA carries 1.26.06 for noble, which is what the package
      # is developed and tested against.  The runner is pinned for that reason:
      # ubuntu-latest moving to another series could move the M2 version too.
      #
      # The apt source is written out by hand rather than by
      # add-apt-repository, which asks Launchpad's API for the signing key and
      # has been seen to fail there with a transient
      # GPGKeyTemporarilyNotFoundError (HTTP 500).  The key is fetched from the
      # keyserver by its fingerprint instead, and both network steps are
      # retried.
      - name: Install Macaulay2
        env:
          M2_PPA_FINGERPRINT: 5B17CD31DA995CFAA1B0D4FD08416FF271BC6AA8
        run: |
          set -eu
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed; retrying in $((i * 10))s" >&2
              sleep $((i * 10))
            done
            return 1
          }
          sudo install -d -m 0755 /etc/apt/keyrings
          retry sh -c "curl -fsSL \
            'https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x${M2_PPA_FINGERPRINT}' \
            | sudo gpg --dearmor -o /etc/apt/keyrings/macaulay2.gpg"
          echo "deb [signed-by=/etc/apt/keyrings/macaulay2.gpg]" \
            "https://ppa.launchpadcontent.net/macaulay2/macaulay2/ubuntu" \
            "$(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/macaulay2.list
          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends macaulay2
          M2 --version

      # installPackage writes a .installed marker under Macaulay2's own prefix
      # (pkg#"package prefix" plus the packagelib layout), not under the
      # InstallPrefix it is given.  A Homebrew prefix is user-owned so this goes
      # unnoticed locally; the Debian package's is /usr, which the runner user
      # cannot write, and the dependency installs stopped there with
      # "can't make directory ...: Permission denied".
      - name: Let Macaulay2 write its package-lib directory
        run: |
          set -eu
          LIBDIR=$(M2 --no-readline -q -e \
            'print(prefixDirectory | replace("PKG/", "", currentLayout#"packagelib")); exit 0' \
            < /dev/null | tail -1)
          echo "package lib directory: $LIBDIR"
          sudo install -d -m 0775 -o "$(id -un)" -g "$(id -gn)" "$LIBDIR"

      - name: Build the manual
        run: make docs

      - name: Make the pages self-contained
        run: |
          .github/make-site.sh \
            doc-build/share/doc/Macaulay2/MMPComputation/html \
            site MMPComputation \
            "https://github.com/${{ github.repository }}"

      # The same tar the upload action runs, so that if it objects the message
      # appears here rather than as a bare exit code inside that action.
      - name: Check the site tars cleanly
        run: |
          find site ! -type f ! -type d -print
          tar --dereference --hard-dereference -cf /dev/null -C site .
          du -sh site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
